<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo</title>
    <link rel="stylesheet" href="style.css">
</head>

    <body>
        <nav class="main-nav">
        <h2>Tienda en linea</h2>
        <br>
        <button onclick="mostrarSeccion('vista-publico')">Ropa</button>
        <button onclick="mostrarSeccion('vista-login')">Añadir Ropa</button>
    </nav>

    <div class="container">
        <!-- SECCIÓN 1: GALERÍA PÚBLICA -->
        <section id="vista-publico">
            <h2>Ropa Disponible</h2>
            <div id="contenedor-propiedades" class="grid-propiedades">
                <!-- Las casas aprobadas aparecen aquí -->
            </div>
        </section>
        
        <!-- SECCIÓN 2: ACCESO (Login y Registro) -->
        <section id="vista-login" class="hidden">
            <h2>Ingreso al Sistema</h2>
            <select id="rol-seleccionado" onchange="verificarRol()">
                <option value="usuario">Soy Usuario / Propietario</option>
                <option value="admin">Soy Administrador</option>
            </select>
            
            <div id="campo-codigo-admin" class="hidden">
                <input type="password" id="codigo-admin" placeholder="Código de Autorización">
            </div>

            <form id="form-auth">
                <input type="text" id="nombre" placeholder="Nombre de usuario" required>
                <input type="password" id="pass" placeholder="Contraseña" required>
                
                <!-- Modificación: Ahora es un enlace a la foto de identificación -->
                <div id="registro-extra">
                    <label>Enlace a Foto de Identificación (INE):</label>
                    <input type="url" id="identificacion-url" placeholder="https://enlace-a-tu-foto.com">
                </div>
                
                <button type="submit">Entrar al Panel</button>
            </form>
        </section>
    

        </body>
        </html>
        </section>
